<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Enquiry | Sole Haven Shoes</title>

    <meta name="description"
    content="Send a product enquiry to Sole Haven Shoes. Ask about shoe availability, prices, sizes and footwear collections.">

    <link rel="stylesheet" href="CSS/styles1.css">

    <script src="JavaScript/script.js" defer></script>

</head>

<body>

    <!-- HEADER -->
    <header>

        <h1>Sole Haven Shoes</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="Men'Shoes.html">Men</a>
            <a href="Women'Shoe.html">Women</a>
            <a href="Kids'Shoes.html">Kids</a>
            <a href="contact.html">Contact</a>
            <a href="shop.html">Shop</a>
            <a href="enquiry.html">Enquiry</a>
        </nav>

    </header>


    <!-- ENQUIRY SECTION -->
    <main>

        <section class="enquiry-section">

            <h2>Product Enquiry Form</h2>

            <p>
                Interested in our footwear collections?
                Complete the form below to enquire about
                products, prices, sizes and availability.
            </p>


            <form id="enquiryForm">

                <!-- CUSTOMER NAME -->
                <label for="fullName">Full Name:</label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    minlength="2"
                    maxlength="60"
                    required
                >


                <!-- EMAIL -->
                <label for="email">Email Address:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >


                <!-- PHONE -->
                <label for="phone">Phone Number:</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="e.g. 0821234567"
                    pattern="0[1-9][0-9]{8}"
                    title="Enter a valid 10-digit South African phone number."
                    required
                >


                <!-- ENQUIRY TYPE -->
                <label for="enquiryType">Type of Enquiry:</label>

                <select id="enquiryType" name="enquiryType" required>

                    <option value="">Select an enquiry type</option>

                    <option value="Product Availability">
                        Product Availability
                    </option>

                    <option value="Product Pricing">
                        Product Pricing
                    </option>

                    <option value="Product Information">
                        Product Information
                    </option>

                    <option value="Size Availability">
                        Size Availability
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <!-- PRODUCT CATEGORY -->
                <label for="category">Shoe Category:</label>

                <select id="category" name="category" required>

                    <option value="">Select a category</option>

                    <option value="Men's Shoes">Men's Shoes</option>

                    <option value="Women's Shoes">Women's Shoes</option>

                    <option value="Children's Shoes">Children's Shoes</option>

                </select>


                <!-- PRODUCT NAME -->
                <label for="product">Product Name:</label>

                <input
                    type="text"
                    id="product"
                    name="product"
                    placeholder="Enter the shoe name"
                    maxlength="100"
                    required
                >


                <!-- SHOE SIZE -->
                <label for="shoeSize">Shoe Size:</label>

                <select id="shoeSize" name="shoeSize" required>

                    <option value="">Select your shoe size</option>

                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>

                </select>


                <!-- MESSAGE -->
                <label for="message">Additional Information:</label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    minlength="10"
                    maxlength="1000"
                    placeholder="Tell us more about your enquiry..."
                    required
                ></textarea>


                <!-- SUBMIT BUTTON -->
                <button type="submit">
                    Submit Enquiry
                </button>

                <button type="reset">
                    Clear Form
                </button>

            </form>


            <!-- RESPONSE MESSAGE -->
            <div id="enquiryResponse" aria-live="polite"></div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>&copy; 2026 Sole Haven Shoes. All Rights Reserved.</p>

    </footer>

</body>

</html>
