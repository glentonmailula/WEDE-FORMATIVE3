<!DOCTYPE html>
<html>
<head>
    <title>Sole Haven - Social Media</title>
    <link rel="stylesheet" href="CSS/styles1.css">
    <script src="JavaScript/script.js" defer></script>

    <style>
       body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffffff;
            margin: 0;
            color: #222222;
        }

        /* HEADER */
        header {
            background-color: #111111;
            padding: 20px;
        }

        header h2 {
            color: #d4af37;
            margin-bottom: 15px;
        }

        /* NAVIGATION */
        nav a {
            margin: 15px;
            text-decoration: none;
            color: #ffffff;
        }

        nav a:hover {
            color: #d4af37;
        }

        /* SOCIAL MEDIA */
        .social {
            padding: 60px 20px;
            min-height: 450px;
        }

        .social h1 {
            font-size: 40px;
            color: #111111;
            margin-bottom: 15px;
        }

        .social h1 span {
            color: #d4af37;
        }

        .social p {
            color: #555555;
            margin-bottom: 35px;
        }

        /* SOCIAL BUTTONS */
        .social a {
            display: block;
            margin: 20px auto;
            padding: 15px;
            width: 250px;
            background-color: #111111;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            border: 2px solid #d4af37;
        }

        .social a:hover {
            background-color: #d4af37;
            color: #111111;
        }

        /* FOOTER */
        footer {
            background-color: #111111;
            color: #ffffff;
            padding: 20px;
        }

    </style>

</head>

<body>

    <!-- HEADER -->
    <header>

        <h2>Sole Haven</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="social.html">Social Media</a>
            <a href="reviews.html">Reviews</a>
            <a href="faq.html">FAQ</a>
            <a href="contact.html">Contact</a>
            <a href="shop.html">Shop</a>
        </nav>

    </header>


    <!-- SOCIAL MEDIA SECTION -->
    <section class="social">

        <h1>Follow <span>Sole Haven</span></h1>

        <p>
            Connect with Sole Haven and keep up with our
            latest shoes, new arrivals and special offers.
        </p>


        <a href="https://www.facebook.com/"
       target="_blank"
       rel="noopener noreferrer">
       Facebook
    </a>

    <a href="https://www.instagram.com/"
       target="_blank"
       rel="noopener noreferrer">
       Instagram
    </a>

    <a href="https://www.tiktok.com/"
       target="_blank"
       rel="noopener noreferrer">
       TikTok
    </a>

    </section>


    <!-- FOOTER -->
    <footer>

        <p>
            &copy; 2026 Sole Haven Shoes. All rights reserved.
        </p>

    </footer>

</body>

</html>
