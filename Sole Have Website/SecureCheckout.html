<!DOCTYPE html>
<html>
<head>
    <title>Sole Haven - Checkout</title>
    <link rel="stylesheet" href="CSS/styles1.css">
    <script src="JavaScript/script.js" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            color: #222222;
        }

        header {
            background-color: #111111;
            padding: 20px;
            text-align: center;
        }

        header h2 {
            margin: 0 0 15px;
            color: #d4af37;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #ffffff;
        }
        nav a:hover {
            color: #d4af37;
        }

        .checkout {
            max-width: 500px;
            margin: 40px auto;
            background-color: #f8f6f2;
            padding: 30px;
            border-radius: 8px;
            border-top: 5px solid #d4af37;
        }

        h1 {
            text-align: center;
            color: #111111;
            margin-bottom: 30px;
        }

        h1 span {
            color: #d4af37;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #222222;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        input:focus {
            outline: none;
            border-color: 2px solid #d4af37;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #111111;
            color: white;
            border: 2px solid #d4af37;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #d4af37;
            color: #111111;
        }

        .secure {
            text-align: center;
            color: #d4af37;
            margin-top: 20px;
            font-weight: bold;
        }

        footer {
            background-color: #111111;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h2>Sole Haven</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="shop.html">Shop</a>
        </nav>
    </header>

    <div class="checkout">

        <h1>Secure Checkout</h1>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Address</label>
            <input type="text" placeholder="Enter your address" required>

            <label>Card Number</label>
            <input type="text" placeholder="Card number" required>

            <label>Expiry Date</label>
            <input type="text" placeholder="MM/YY" required>

            <label>CVV</label>
            <input type="password" placeholder="CVV" required>

            <button type="submit">
                Place Order
            </button>

        </form>

        <p class="secure"> Secure Checkout</p>

    </div>

    <footer>
        <p>&copy; 2026 Sole Haven</p>
    </footer>

</body>
</html>
