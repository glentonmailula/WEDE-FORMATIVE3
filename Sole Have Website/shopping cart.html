
<!DOCTYPE html>
<html>
<head>
    <title>Sole Haven - Shopping Cart</title>
    <link rel="stylesheet" href="CSS/styles1.css">
    <script src="JavaScript/script.js" defer></script>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #ffffff;
            color: #222222;
        }

        header {
            background-color: #111111;
            padding: 20px;
            text-align: center;
        }

        header h2 {
            color: #d4af37;
        }

        nav a {
            margin: 15px;
            text-decoration: none;
            color: #ffffff;
        }

        nav a:hover {
            color: #d4af37;
        }

        .cart {
            padding: 50px 20px;
            text-align: center;
            min-height: 500px;
        }

        .cart h1 {
            margin-bottom: 40px;
            color: #111111;
            margin-top: 30px;
        }

        .item {
            background-color: #ffffff;
            padding: 25px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 8px;
            border-top: 4px solid #d4af37;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .item h2 {
            color: #111111;
        }

        .item p {
            margin: 10px;
            color: #444444;
        }
        /*TOTAL*/
        .total {
            color: #111111;
            margin: 25px;
        }

        .total span {
            color: #d4af37;
        }

        .checkout {
            background-color: #111111;
            color: ffffff;
            padding: 14px 30px;
            border: 2px solid #d4af37;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .checkout:hover {
            background-color: #d4af37;
            color: #111111;
        }

        footer {
            background-color: #111111;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h2>Sole Haven</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="shop.html">Shop</a>
            <a href="shopping cart.html">Cart</a>
        </nav>
    </header>

    <section class="cart">

        <h1>Shopping Cart</h1>

        <div class="item">
            <h2>Urban Runner</h2>
            <p>Price: R899</p>
            <p>Quantity: 1</p>
        </div>

        <h2>Total: R899</h2>

        <button class="checkout">
            Checkout
        </button>

    </section>

    <footer>
        <p>&copy; 2026 Sole Haven shoes.All rights reserved.</p>
    </footer>

</body>
</html>
