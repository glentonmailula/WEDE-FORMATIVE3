<!DOCTYPE html>
<html>
<head>
    <title>Sole Haven</title>
    <link rel="stylesheet" href="CSS/styles1.css">
    <script src="JavaScript/script.js" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #ffffff;
            color: #222222;
            text-align: center;
        }

         /* HEADER */
        header {
            background-color: #111111;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            color: #d4af37;
            margin-bottom: 15px;
        }

         /* NAVIGATION */
        nav a {
            margin: 15px;
            text-decoration: none;
            color: #ffffff;
        }

        nav a:hover {
            color: #d4af37;
        }


        .search {
            margin: 80px auto;
            padding: 40px 20px;
            max-width: 700px;
            text-align: center;
        }

        .search h2 {
            font-size: 35px;
            color: #111111;
            margin-bottom: 15px;
        }

        .search h2 span {
            color: #d4af37;
        }

        .search p {
            color: #555555;
            margin-bottom: 30px;
        }

        input {
            padding: 10px;
            width: 250px;
            border: 2px solid #d4af37;
            border-radius: 5px 0 0 5px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #111111;
        }

        button {
           padding: 14px 25px;
            background-color: #111111;
            color: #ffffff;
            border: 2px solid #111111;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
        }

        button:hover {
            background-color: #d4af37;
            color: #111111;
            border-color: #d4af37;
        }

        /* FOOTER */
        footer {
            background-color: #111111;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
    </style>

</head>

<body>

    <!-- HEADER -->
    <header>

        <h1>Sole Haven</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="shop.html">Shop</a>
            <a href="reviews.html">Reviews</a>
            <a href="faq.html">FAQ</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <!-- SEARCH -->
    <section class="search">

        <h2>Search <span>Sole Haven</span></h2>

        <p>
            Find the perfect shoes for you, your family and your lifestyle.
        </p>

        <input
            type="text"
            placeholder="Search for shoes..."
        >

        <button>
            Search
        </button>

    </section>


    <!-- FOOTER -->
    <footer>

        <p>
            &copy; 2026 Sole Haven Shoes. All rights reserved.
        </p>

    </footer>

</body>

</html>
