<!DOCTYPE html>
<html>
<head>
    <title>Sole Haven - Kids Shoes</title>
    <link rel="stylesheet" href="CSS/styles1.css">
    <script src="JavaScript/script.js" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #ffffff;
            color: #222222;
        }

        /* HEADER */
        header {
            background-color: #111111;
            padding: 20px;
            text-align: center;
        }

        header h2 {
            color: #d4af37;
            margin-bottom: 15px;
        }

        /* NAVIGATION */
        nav a {
            margin: 15px;
            text-decoration: none;
            color: #ffffff;
        }

        nav a:hover {
            color: #d4af37;
        }

        /* SHOES SECTION */
        .shoes {
            text-align: center;
            padding: 50px 20px;
        }

        .shoes h1 {
            font-size: 40px;
            color: #111111;
        }

        .shoes h1 span {
            color: #d4af37;
        }

        .shoes > p {
            color: #555555;
            margin-bottom: 35px;
        }

        /* PRODUCT */
        .product {
            background-color: #f8f8f8;
            width: 300px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
            border-top: 5px solid #d4af37;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        /* IMAGE AREA */
        .product img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 5px;
        }

        .product h2 {
            color: #111111;
            margin-top: 20px;
        }

        .product p {
            color: #555555;
            line-height: 1.5;
        }

        /* PRICE */
        .price {
            font-weight: bold;
            color: #d4af37 !important;
            font-size: 20px;
        }

        /* ADD TO CART */
        .cart-button {
            display: inline-block;
            background-color: #111111;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border: 2px solid #d4af37;
            border-radius: 5px;
            margin-top: 10px;
        }

        .cart-button:hover {
            background-color: #d4af37;
            color: #111111;
        }

        /* FOOTER */
        footer {
            background-color: #111111;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

    </style>

</head>

<body>

    <!-- HEADER -->
    <header>

        <h2>Sole Haven</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="Men'Shoes.html">Men</a>
            <a href="Women'Shoe.html">Women</a>
            <a href="Kids'Shoes.html">Kids</a>
            <a href="shopping cart.html">Cart</a>
            <a href="contact.html">Contact</a>
            <a href="shop.html">Shop</a>
        </nav>

    </header>


    <!-- KIDS SHOES -->
    <section class="shoes">

        <h1>Kids' <span>Shoes</span></h1>

        <p>
            Comfortable and stylish shoes for kids.
        </p>


        <div class="product">

            <!-- ADD YOUR SHOE IMAGE HERE -->
            <img src="image/kids.webp" alt="Kids shoes">


            <h2>Kids Runner</h2>

            <p>
                Comfortable and lightweight shoes designed
                for everyday activities.
            </p>


            <p class="price">
                R599
            </p>


            <a href="cart.html" class="cart-button">
                Add to Cart
            </a>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>

        <p>
            &copy; 2026 Sole Haven Shoes. All rights reserved.
        </p>

    </footer>

</body>

</html>
