<!DOCTYPE html>
<html>
<head>
    <title>Sole Haven - Customer Reviews</title>
    <link rel="stylesheet" href="CSS/styles1.css">
    <script src="JavaScript/script.js" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #ffffff;
            color: #222222;
        }

        header {
            background-color: #111111;
            padding: 20px;
            text-align: center;
        }

        nav a {
            margin: 15px;
            text-decoration: none;
            color: #ffffff;
        }

        nav a:hover {
            color: #d4af37;
        }

        .reviews {
            text-align: center;
            padding: 50px 20px;
        }

        .review h1{
            font-size: 40px;
            color: #111111;
            margin-bottom: 35px
        }

        .review h1 span{
            color: #d4af37;
        }
        /* review cards */
        .review {
            background-color: #f8f8f8;
            margin: 20px auto;
            padding: 25px;
            max-width: 500px;
            border-radius: 8px;
            border-top: 5px solid #d4af37;
        }
        .review h3 {
            margin-bottom: 5px;
            color: #111111;
        }
        .stars {
            color: #d4af37;
            font-size: 20px;
            margin-bottom: 10px 0;
        }
        .review p:last-child {
            color: #444444;
            line-height: 1.6;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h2>Sole Haven</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="reviews.html">Reviews</a>
            <a href="shop.html">Shop</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="reviews">

        <h1>Customer Reviews</h1>

        <div class="review">
            <h3>Sarah</h3>
            <p class="stars">★★★★★</p>
            <p>"The shoes are comfortable and look great!"</p>
        </div>

        <div class="review">
            <h3>James</h3>
            <p class="stars">★★★★★</p>
            <p>"Great quality and fast service. I love my shoes."</p>
        </div>

        <div class="review">
            <h3>Thandi</h3>
            <p class="stars">★★★★☆</p>
            <p>"Very stylish shoes and comfortable to wear."</p>
        </div>

    </section>

    <footer>
        <p>&copy; 2026 Sole Haven. All rights reserved.</p>
    </footer>

</body>
</html>
